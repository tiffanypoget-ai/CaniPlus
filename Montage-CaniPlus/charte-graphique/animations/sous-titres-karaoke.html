<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      sous-titres-karaoke — sous-titres animés mot à mot, style sobre.
      Inter, blanc sur bandeau sombre translucide ; les mots clés passent en
      bleu #2babe1 et gras.

      À adapter par vidéo : remplacer le tableau PHRASES ci-dessous à partir de
      transcript.md (timecodes réels de la voix, via `npx hyperframes transcribe`).
        - t : début du mot (s), d : durée d'affichage avant le mot suivant
        - kw: true → mot clé surligné en bleu
      Zone occupée : ~y 1150–1400 px (au-dessus de l'interface TikTok).
    -->
  </head>
  <body>
    <template>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
      />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: Inter, system-ui, sans-serif;
        }
        #subs-zone {
          position: absolute;
          top: 1150px;
          left: 50px;
          right: 50px;
          height: 250px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .subs-phrase {
          position: absolute;
          max-width: 920px;
          padding: 22px 34px;
          border-radius: 20px;
          background: rgba(26, 43, 51, 0.72);
          text-align: center;
          font-size: 54px;
          font-weight: 600;
          line-height: 1.3;
          color: #ffffff;
        }
        .subs-word {
          display: inline-block;
          margin: 0 7px;
        }
        .subs-word.kw {
          color: #2babe1;
          font-weight: 700;
        }
      </style>

      <div
        id="root"
        data-composition-id="sous-titres-karaoke"
        data-width="1080"
        data-height="1920"
        data-duration="6"
      >
        <section id="subs-zone" class="clip" data-start="0" data-duration="6"></section>
      </div>

      <script>
        (function () {
          // Contenu de démonstration — remplacé par les timecodes réels de chaque vidéo.
          const PHRASES = [
            {
              start: 0.2,
              end: 3.0,
              words: [
                { w: "Ton", t: 0.2 },
                { w: "chien", t: 0.45, kw: true },
                { w: "ne", t: 0.75 },
                { w: "tire", t: 0.9, kw: true },
                { w: "pas", t: 1.2 },
                { w: "pour", t: 1.4 },
                { w: "te", t: 1.6 },
                { w: "dominer.", t: 1.8 },
              ],
            },
            {
              start: 3.1,
              end: 5.8,
              words: [
                { w: "Il", t: 3.2 },
                { w: "tire", t: 3.4 },
                { w: "parce", t: 3.65 },
                { w: "que", t: 3.85 },
                { w: "ça", t: 4.0 },
                { w: "marche.", t: 4.2, kw: true },
              ],
            },
          ];

          const zone = document.getElementById("subs-zone");
          const tl = gsap.timeline({ paused: true });

          PHRASES.forEach(function (phrase, pi) {
            const box = document.createElement("p");
            box.className = "subs-phrase";
            box.id = "subs-phrase-" + pi;
            phrase.words.forEach(function (word, wi) {
              const span = document.createElement("span");
              span.className = "subs-word" + (word.kw ? " kw" : "");
              span.id = "subs-w-" + pi + "-" + wi;
              span.textContent = word.w;
              box.appendChild(span);
            });
            zone.appendChild(box);

            tl.fromTo(
              box,
              { autoAlpha: 0, y: 24 },
              { autoAlpha: 1, y: 0, duration: 0.22, ease: "power2.out" },
              phrase.start
            );
            // Style karaoké : les mots pas encore dits restent visibles en
            // semi-transparent, chaque mot passe à pleine opacité quand il est dit.
            phrase.words.forEach(function (word, wi) {
              tl.fromTo(
                "#subs-w-" + pi + "-" + wi,
                { opacity: 0.3 },
                { opacity: 1, duration: 0.14, ease: "power2.out" },
                word.t
              );
            });
            tl.to(box, { autoAlpha: 0, duration: 0.18, ease: "power1.in" }, phrase.end);
          });

          window.__timelines["sous-titres-karaoke"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
