<header class="nav">
  <div class="nav-inner">
    <a href="/" class="logo-link" style="display:flex; align-items:center;">
      <img src="/images/logo-caniplus.png" alt="CaniPlus" class="logo-img"
           width="400" height="300" loading="eager" decoding="async"
           onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='block';">
      <span class="logo-fallback">Cani<span>Plus</span></span>
    </a>
    <nav id="mainNav" aria-label="Navigation principale">
      <ul>
        <li><a href="/">Accueil</a></li>
        <li><a href="/#approche">Approche</a></li>
        <li><a href="/#prestations">Prestations</a></li>
        <li><a href="/#boutique">Boutique</a></li>
        <li><a href="/#apropos">À propos</a></li>
        <li><a href="/blog">Blog</a></li>
        <li><a href="/#evenements">Événements</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
    </nav>
    <a href="https://app.caniplus.ch" class="btn btn-primary">Mon espace</a>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false" aria-controls="mainNav">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<script>
  // Menu mobile. Ce script accompagne le bouton du fragment d'en-tete : il doit
  // rester avec lui, sinon les pages internes affichent un bouton inerte.
  (function () {
    var toggle = document.getElementById('menuToggle');
    var mainNav = document.getElementById('mainNav');
    if (!toggle || !mainNav) return;
    function close() {
      toggle.classList.remove('open');
      mainNav.classList.remove('open');
      document.body.classList.remove('menu-open');
      toggle.setAttribute('aria-expanded', 'false');
    }
    toggle.addEventListener('click', function () {
      var open = !mainNav.classList.contains('open');
      toggle.classList.toggle('open', open);
      mainNav.classList.toggle('open', open);
      document.body.classList.toggle('menu-open', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    mainNav.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', close); });
    document.addEventListener('click', function (e) {
      if (mainNav.classList.contains('open') && !mainNav.contains(e.target) && !toggle.contains(e.target)) close();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    // Le focus suit la navigation par ancres (clavier et lecteur d'ecran)
    document.addEventListener('click', function (e) {
      var link = e.target.closest('a[href*="#"]');
      if (!link) return;
      var hash = link.getAttribute('href').split('#')[1];
      if (!hash) return;
      var target = document.getElementById(hash);
      if (!target) return;
      if (!target.hasAttribute('tabindex')) target.setAttribute('tabindex', '-1');
      setTimeout(function () { target.focus({ preventScroll: true }); }, 0);
    });
  })();
</script>
